<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OurRadioFS — Live Pilot Map</title>
  <meta name="description" content="Live map of OurRadioFS pilots who chose to share their position.">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --bg: #0D1117;
      --surface: #161B22;
      --border: #30363D;
      --text: #C9D1D9;
      --title: #E6EDF3;
      --muted: #6E7681;
      --amber: #E8A33D;
      --mono: 'Consolas', 'SF Mono', 'Roboto Mono', ui-monospace, monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }

    /* HEADER */
    header {
      display: flex;
      align-items: center;
      height: 56px;
      gap: 12px;
      padding: 0 18px;
      background: rgba(13, 17, 23, 0.9);
      border-bottom: 1px solid var(--border);
      z-index: 1200;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 16px;
      font-weight: 700;
      color: var(--title);
    }

    .brand img { width: 26px; height: 26px; }

    header .links {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 14px;
    }

    header .links a { color: var(--text); }
    header .links a:hover { color: var(--title); }

    /* Empuja el contador y los enlaces a la derecha. Es un elemento propio en vez de
       un 'margin-left:auto' en los enlaces porque el contador APARECE Y DESAPARECE:
       con el margen en los enlaces, al ocultarse el contador se perdía el empuje. */
    header .spacer { flex: 1; }

    /* Cuántos pilotos hay en el mapa. Mismo lenguaje que la frecuencia (mono + ámbar).
       La raya vertical lo separa de la navegación: a la izquierda estado, a la derecha
       enlaces. Se oculta ENTERO (raya incluida) cuando no hay nadie — ver updateCount. */
    .online {
      display: flex;
      align-items: center;
      /* Altura fija para la raya: sin esto valdría lo que mida el texto (~15 px) y
         quedaría raquítica. Corta y centrada, no de borde a borde de la barra. */
      height: 24px;
      gap: 8px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text);
      border-right: 2px solid var(--border);
      /* El aire a los dos lados de la raya es lo que hace que se lean como dos
         grupos (estado | navegación) y no como una fila de cosas sueltas. Sale
         simétrico: 26 px a la izquierda de la raya, y 14 + los 12 del gap del
         header a la derecha. Si se toca uno, tocar el otro. */
      padding-right: 26px;
      margin-right: 14px;
    }

    .online[hidden] { display: none; }
    .online .dot { width: 7px; height: 7px; border-radius: 50%; background: #3FB950; }
    .online .n { color: var(--amber); }
    .online .sep { color: var(--muted); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--amber);
      color: #1a1205 !important;
      border-color: var(--amber);
    }

    /* MAP */
    #map { flex: 1; min-height: 0; background: #0a0d12; }
    .leaflet-container { background: #0a0d12; }

    /* AIRCRAFT MARKER */
    .plane-marker {
      /* absolute (no relative): Leaflet coloca cada marcador con transform; si es
         relative, los marcadores se apilan en el flujo del documento y salen "en fila"
         cuando dos aviones están en el mismo punto en vez de superponerse. */
      position: absolute;
      width: 80px;
      height: 42px;
    }

    /* La caja mide 80x42 pero el avión dibujado son 26x26 en el centro. Si la caja
       entera captura el ratón, dos aviones cercanos se tapan entre ellos: apuntas al
       dibujo de uno y el evento se lo lleva la caja TRANSPARENTE del vecino que esté
       por encima, y ese avión no responde. Sensibles solo el dibujo y la etiqueta.
       LA DOBLE CLASE ES OBLIGATORIA: Leaflet trae
       `.leaflet-marker-icon.leaflet-interactive { pointer-events: auto }` y con un
       solo `.plane-marker` le gana él por especificidad y esto no hace nada. */
    .plane-marker.leaflet-interactive {
      pointer-events: none;
    }

    .plane-marker .plane,
    .plane-marker .tag {
      pointer-events: auto;
    }

    .plane-marker .plane {
      position: absolute;
      left: 27px;
      top: 7px;
      width: 26px;
      height: 26px;
      color: var(--amber);
      transform-origin: center center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .plane-marker .plane svg {
      display: block;
      width: 26px;
      height: 26px;
      overflow: visible;
    }

    .plane-marker .tag {
      position: absolute;
      left: 40px;
      top: 31px;
      transform: translateX(-50%);
      padding: 1px 5px;
      color: var(--title);
      background: rgba(13, 17, 23, 0.9);
      border: 1px solid var(--border);
      border-radius: 5px;
      font-family: var(--mono);
      font-size: 10px;
      line-height: 14px;
      white-space: nowrap;
      display: none;            /* oculto por defecto: al alejar se amontonan */
    }

    /* Nombres solo al acercar el zoom (los aviones ya están separados) o al pasar el
       ratón por encima. Al alejar se ven solo los iconos: limpio como FlightRadar. */
    /* Aro de alcance VHF (al pasar el ratón). Solo el borde y tenue: con relleno
       sólido tapaba el terreno y se comía a los demás aviones. */
    .range-ring { animation: ringIn .22s ease-out; }
    @keyframes ringIn { from { opacity: 0 } to { opacity: 1 } }

    /* Los que quedan fuera del alcance del avión señalado, apagados. */
    .plane-marker.out .plane { color: #4c545e; }
    .plane-marker.out .tag { color: #6E7681; }
    /* El señalado se distingue por el COLOR (blanco contra el ámbar del resto y el gris
       de los que quedan fuera de alcance), sin ningún halo. Llevaba un drop-shadow
       blanco y se quitó por lo mismo que el ámbar: el color ya lo separa de sobra. */
    .plane-marker.sel .plane { color: #fff; }

    #map.show-tags .plane-marker .tag { display: block; }
    .plane-marker:hover .tag { display: block; }
    .plane-marker:hover { z-index: 10000 !important; }

    /* LEAFLET */
    .leaflet-bar a {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }

    .leaflet-bar a:hover { background: #1b212b; }

    .leaflet-control-attribution {
      background: rgba(13, 17, 23, 0.7) !important;
      color: var(--muted) !important;
    }

    .leaflet-control-attribution a { color: var(--muted) !important; }

    /* Aviso de cómo ver el aro de alcance. Va como control de Leaflet (no un div
       suelto encima del mapa) para que respete el resto de controles: no se solapa
       con el zoom (arriba a la izquierda) ni con la attribution (abajo a la derecha),
       y se reposiciona solo si algún día se añade otro control en esa esquina. */
    .range-hint {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 7px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 11px;
      line-height: 1.3;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,.35);
    }
    .range-hint-row { display: flex; align-items: center; gap: 7px; }
    .range-hint svg { flex: none; }
    /* Fila 1, el aro: mismo trazo ámbar que el aro real, para que la relación entre
       icono y función sea obvia de un vistazo. Fila 2, el clic: un cursor simple en
       el color del texto normal, sin ámbar, porque no está ligado al aro. */
    .range-hint-row:first-child svg circle { fill: none; stroke: var(--amber); stroke-width: 1.5; }
    .range-hint-row:first-child svg circle:first-child { fill: var(--amber); stroke: none; }
    .range-hint-row:last-child svg path { fill: var(--text); }
    .range-hint b { color: var(--text); font-weight: 600; }

    /* COMPACT POPUP */
    .leaflet-popup-content-wrapper {
      padding: 0 !important;
      border-radius: 10px !important;
      overflow: hidden;
      background: transparent !important;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8) !important;
    }

    .leaflet-popup-tip { background: var(--bg) !important; }

    .leaflet-popup-content {
      margin: 0 !important;
      width: max-content !important;
      min-width: 180px;
      /* TOPE DE ANCHO. Los aviones de mods traen nombres larguísimos ("Boeing 737-800
         BBJ Winglets Ultimate Livery…"): sin tope, max-content estiraba el popup hasta
         taparle media pantalla al usuario. Aquí se corta y el nombre se elide. */
      max-width: 260px !important;
    }

    .flight-popup {
      background: var(--surface);
      color: var(--text);
      font-family: var(--sans);
    }

    /* CABECERA: indicativo y avión en la misma línea, el avión justo al lado. */
    .flight-popup-header {
      display: flex;
      align-items: center;
      gap: 9px;
      /* El hueco de la derecha NO es decorativo: la X de cerrar de Leaflet va posicionada
         en absoluto sobre la esquina superior derecha del popup (24x24 px en 1.9.4). Sin
         reservarle sitio, la chapa del avión se le metía debajo. */
      /* 7px arriba y abajo, no 10: con el indicativo a 17px la cabecera se iba a 40px de
         alto y sobresalía sobre el pie (34px), que es lo que la hacía parecer hinchada.
         Así las dos bandas miden lo mismo y enmarcan el cuerpo por igual. */
      padding: 7px 30px 7px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border);
    }

    /* El indicativo manda: es el dato con el que le llamas por radio. NO se encoge
       (flex-shrink:0) → un nombre de avión largo YA NO lo corta; cede la chapa del avión. */
    .flight-popup-callsign {
      flex: 0 0 auto;
      min-width: 0;
      overflow: hidden;
      color: var(--title);
      font-family: var(--mono);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.6px;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* El avión va en su propia chapa para que se lea como un designador de tipo y no
       como texto suelto; rima con la chapa COM1 del pie. Llega ya recortado desde JS,
       así que no encoge: el hueco que ocupa es siempre acotado. */
    .flight-popup-aircraft {
      flex: 0 1 auto;
      min-width: 0;                /* cede primero: si no cabe, se encoge esta chapa, no el callsign */
      max-width: 70px;             /* tope en PÍXELES: el popup no se descuadra nunca */
      overflow: hidden;
      padding: 2px 7px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .flight-popup-aircraft .acname {
      display: inline-block; white-space: nowrap;
      /* Corre solo mientras el popup está abierto (el chip solo existe entonces), y solo
         si de verdad excede: min(0px, …) deja quieto lo que ya cabe. */
      animation: acScroll 4s ease-in-out infinite alternate;
    }
    @keyframes acScroll {
      from { transform: translateX(0); }
      to   { transform: translateX(min(0px, calc(56px - 100%))); }
    }

    .flight-popup-body { padding: 11px 12px; }

    .flight-popup-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(70px, 1fr));
      gap: 10px 14px;
    }

    .flight-data-item {
      display: flex;
      flex-direction: column;
    }

    .flight-data-label {
      margin-bottom: 1px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .flight-data-value {
      color: var(--title);
      font-size: 12px;
      font-weight: 600;
    }

    .flight-popup-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }

    .freq-box {
      display: flex;
      /* baseline, no center: son dos tipografías distintas (la chapa en sans a 10px, la
         frecuencia en mono a 13px). Centrando las CAJAS, las letras quedan a alturas
         distintas y se ve que "no están en la misma línea". Alineando las BASES, se
         apoyan en el mismo renglón, que es lo que percibe el ojo. */
      align-items: baseline;
      gap: 7px;
    }

    .freq-label {
      padding: 2px 5px;
      background: var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 10px;
      font-weight: 700;
      /* Ancho común para que COM1 y COM2 dejen sus frecuencias en la MISMA columna:
         desalineadas una debajo de otra se nota mucho en una pila de números. */
      min-width: 44px;
      text-align: center;
    }

    .freq-value {
      color: var(--amber);
      font-family: var(--mono);
      /* 12 y no 13: con dual watch el pie pasa a tener DOS frecuencias, y a 13 pesaban
         demasiado para lo que son — el dato principal del popup sigue siendo quién es y
         dónde está, no el número. Con una sola radio la diferencia casi no se nota. */
      font-size: 12px;
      font-weight: 700;
    }

    /* Las dos radios, una debajo de otra. Con una sola contiene un único hijo y el pie
       se ve exactamente igual que antes de existir el dual watch. */
    .freq-stack {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* La radio por la que NO está hablando, apagada. Se probó marcar la de TX con un punto
       (como el ● del visor de la app) y se descartó: el punto es un elemento más en la
       fila, así que ensanchaba la caja y con ella TODO el popup — 12 px que no pagan lo
       que aportan. Atenuar no ocupa nada y dice lo mismo: la viva es donde habla.
       Solo se aplica con dual watch; con una sola radio no hay nada con qué comparar. */
    .freq-idle .freq-value { opacity: .45; }
    .freq-idle .freq-label { opacity: .6; }

    /* Coordenadas del avión, discretas: N/S arriba, E/W abajo, a la derecha de la freq.
       GRID de 2 columnas (hemisferio | valor), no flex-column: con flex cada línea medía
       lo que ocupaba su propio texto y, como la longitud lleva 3 dígitos de grado y la
       latitud solo 2, una quedaba visiblemente más larga que la otra. En grid, la columna
       del hemisferio y la del valor comparten ancho fijo entre las dos filas, así que
       hemisferios y números quedan en la misma vertical (y el punto decimal alineado). */
    .coord-box {
      display: grid;
      grid-template-columns: auto auto;
      column-gap: 3px;
      font-family: var(--mono); font-size: 10px; line-height: 1.3;
      color: var(--muted); opacity: .7;
      font-variant-numeric: tabular-nums;
      /* Separador de la frecuencia: en el propio coord-box (no un elemento aparte)
         para que el alto del trazo se ajuste solo al contenido, y con padding en vez
         de margin para que la línea no quede pegada al texto de ningún lado. */
      padding-left: 10px;
      border-left: 1px solid var(--border);
    }
    .coord-box .hemi { text-align: left; }
    /* Alineado a la derecha: con la latitud rellenada a ancho de 3 caracteres (ver
       fmtLat) las dos cifras miden lo mismo y el punto decimal cae en la misma columna. */
    .coord-box .coord-val { text-align: right; }

  </style>
</head>

<body>
  <header>
    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="">
      OurRadioFS
    </a>
    <span class="spacer"></span>
    <!-- Arranca oculto: hasta que no llega el primer /map/data no se sabe cuánta gente
         hay, y NUNCA se enseña un "0". Si no hay nadie, esto no existe. -->
    <div class="online" id="online" hidden>
      <span class="dot"></span>
      <span id="online-text"></span>
    </div>
    <nav class="links">
      <a href="index.html">Home</a>
      <a href="https://discord.gg/FG4xmEXppQ" target="_blank" rel="noopener">Discord</a>
      <!-- A la sección de descarga de la landing: allí se elige simulador -->
      <a class="btn btn-primary" href="index.html#download">Download</a>
    </nav>
  </header>

  <div id="map"></div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // MAP
    const map = L.map('map', {
      worldCopyJump: true,   // loop infinito: el mundo se repite al desplazar
      zoomControl: true,
      attributionControl: true
    }).setView([46.5, 8.0], 5);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd',
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors ' +
        '&copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>'
    }).addTo(map);

    // Aviso permanente con las dos formas de interactuar con un avión (hover → aro
    // de alcance, clic → popup con los datos del vuelo). Sin la primera fila, quien no
    // pase el ratón lo bastante quieto nunca ve el aro y da por hecho que no existe.
    // Va en 'bottomleft' (única esquina libre: el zoom ocupa 'topleft' y la attribution
    // 'bottomright') y se queda fijo, no es un aviso que se cierre solo, porque es la
    // única pista de que esas dos interacciones existen.
    (function () {
      const RangeHint = L.Control.extend({
        options: { position: 'bottomleft' },
        onAdd: function () {
          const div = L.DomUtil.create('div', 'range-hint');
          div.innerHTML =
            '<div class="range-hint-row">' +
              '<svg width="16" height="16" viewBox="0 0 16 16">' +
                '<circle cx="8" cy="8" r="2"></circle>' +
                '<circle cx="8" cy="8" r="6.5"></circle>' +
              '</svg>' +
              'Hover over a plane for <b>1&nbsp;second</b> to see its radio range' +
            '</div>' +
            '<div class="range-hint-row">' +
              '<svg width="16" height="16" viewBox="0 0 16 16">' +
                '<path d="M4 2.5 12.5 8 8.5 8.7 10.7 12.9 9 13.8 6.8 9.6 4 12.2Z"></path>' +
              '</svg>' +
              '<b>Click</b> a plane for full flight details' +
            '</div>';
          L.DomEvent.disableClickPropagation(div);
          return div;
        }
      });
      map.addControl(new RangeHint());
    })();

    // Etiquetas visibles solo con zoom alto (al acercar, los aviones ya están separados).
    // Al alejar → solo iconos, sin amontonar nombres. En cualquier zoom, el hover muestra
    // el nombre de un avión concreto. Sin ocultar ni mover nada: puro CSS por nivel de zoom.
    const LABEL_ZOOM = 7;
    function updateLabelVisibility() {
      map.getContainer().classList.toggle('show-tags', map.getZoom() >= LABEL_ZOOM);
    }
    map.on('zoomend', updateLabelVisibility);
    updateLabelVisibility();

    // Popup pegado al borde: se cortaba. El autoPan de Leaflet no ajusta bien con contenido
    // custom (corre antes de conocer el tamaño del popup). Al abrir uno, tras el layout, si
    // sobresale del contenedor paneamos lo justo para que quepa entero (con margen).
    map.on('popupopen', function (e) {
      setTimeout(function () {
        const el = e.popup.getElement();
        if (!el) return;
        const m = map.getContainer().getBoundingClientRect();
        const r = el.getBoundingClientRect();
        const pad = 16;
        let dx = 0, dy = 0;
        if (r.left < m.left + pad) dx = r.left - (m.left + pad);
        else if (r.right > m.right - pad) dx = r.right - (m.right - pad);
        if (r.top < m.top + pad) dy = r.top - (m.top + pad);
        else if (r.bottom > m.bottom - pad) dy = r.bottom - (m.bottom - pad);
        if (dx || dy) map.panBy([dx, dy], { animate: true });
      }, 0);
    });

    // AIRCRAFT ICON (single, top-down, points north at 0deg so it rotates with heading)
    const PLANE_ICON =
      '<svg viewBox="0 0 24 24" fill="currentColor">' +
      '<path d="M12 2c-.6 0-1 .9-1 2v5.2L3 14v2l8-2.3V19l-2 1.2V22l3-.9 3 .9v-1.8L13 19v-5.3l8 2.3v-2l-8-4.8V4c0-1.1-.4-2-1-2z"/>' +
      '</svg>';

    function planeIcon(callsign, heading) {
      const rotation = Number(heading) || 0;
      return L.divIcon({
        className: 'plane-marker',
        iconSize: [80, 42],
        iconAnchor: [40, 21],
        html:
          '<div class="plane" style="transform:rotate(' + rotation + 'deg)">' +
          PLANE_ICON +
          '</div>' +
          '<div class="tag">' + esc(callsign) + '</div>'
      });
    }

    // POPUP
    // Tope de caracteres del nombre del avión. Sale de la cuenta del ancho: 260 px de
    // popup, menos el indicativo, menos el hueco de la X. Si se sube, el popup empieza
    // a crecer y a bailar de tamaño según quién esté volando.
    const AIRCRAFT_MAX_CHARS = 16;

    function popupHtml(pilot) {
      // Si no sabemos el avión no pintamos una chapa con un guion dentro: se queda
      // solo el indicativo, que se lee mejor que un hueco relleno de nada.
      //
      // TOPE DE CARACTERES. Los aviones de mods traen nombres larguísimos ("Boeing
      // 737-800 BBJ Winglets Ultimate Livery Pack"). Se cortan aquí, en el dato, y no
      // solo con CSS: así el ancho de la cabecera es PREVISIBLE y el popup no baila de
      // tamaño según quién esté volando. El nombre entero queda en el title.
      const aircraft = pilot.aircraft != null ? String(pilot.aircraft).trim() : '';
      const aircraftShort =
        aircraft.length > AIRCRAFT_MAX_CHARS
          ? aircraft.slice(0, AIRCRAFT_MAX_CHARS - 1).trimEnd() + '…'
          : aircraft;
      const aircraftChip = aircraft
        ? `<span class="flight-popup-aircraft" title="${esc(aircraft)}"><span class="acname">${esc(aircraft)}</span></span>`
        : '';

      const altitude = pilot.alt != null ? fmtAlt(pilot.alt) + ' ft' : '—';

      const speed = pilot.speed != null ? Math.round(pilot.speed) + ' kts' : '—';

      const vspeed =
        pilot.vspeed != null
          ? (pilot.vspeed >= 0 ? '+' : '') + Math.round(pilot.vspeed) + ' fpm'
          : '—';

      const heading =
        pilot.heading != null
          ? String(Math.round(pilot.heading)).padStart(3, '0') + '°'
          : '—';

      const frequency = fmtFreq(pilot.freq);
      // Segunda radio (dual watch). Cada una con su nombre real, COM1 y COM2, igual que
      // en la app: al piloto que mira el mapa le sirve para saber dónde llamar, y
      // llamarlas de otra forma solo le obligaría a traducir.
      // Solo aparece si viene: con una sola radio, con la COM2 muda, con las dos en la
      // misma frecuencia o con una app anterior llega null, y el pie se queda tal cual.
      const hasCom2 = pilot.freq2 != null && pilot.freq2 > 0;
      // Por cuál está HABLANDO. Sin el dato (app vieja) se asume la COM1, que es donde
      // habla todo el mundo. La OTRA se pinta apagada — ver .freq-idle: se descartó
      // marcarla con un punto porque ensanchaba el popup.
      const txRadio = pilot.tx === 2 ? 2 : 1;
      const idle = n => hasCom2 && txRadio !== n ? ' freq-idle' : '';
      const freq2 = hasCom2
        ? `<div class="freq-box${idle(2)}">
             <span class="freq-label">COM2</span>
             <span class="freq-value">${esc(fmtFreq(pilot.freq2))}</span>
           </div>`
        : '';
      const coords = (pilot.lat != null && pilot.lon != null)
        ? `<div class="coord-box">${fmtLat(pilot.lat)}${fmtLon(pilot.lon)}</div>`
        : '';

      return `
        <div class="flight-popup">
          <div class="flight-popup-header">
            <span class="flight-popup-callsign">${esc(pilot.callsign)}</span>
            ${aircraftChip}
          </div>
          <div class="flight-popup-body">
            <div class="flight-popup-grid">
              <div class="flight-data-item">
                <span class="flight-data-label">Altitude</span>
                <span class="flight-data-value">${esc(altitude)}</span>
              </div>
              <div class="flight-data-item">
                <span class="flight-data-label">Speed</span>
                <span class="flight-data-value">${esc(speed)}</span>
              </div>
              <div class="flight-data-item">
                <span class="flight-data-label">Vert. speed</span>
                <span class="flight-data-value">${esc(vspeed)}</span>
              </div>
              <div class="flight-data-item">
                <span class="flight-data-label">Heading</span>
                <span class="flight-data-value">${esc(heading)}</span>
              </div>
            </div>
          </div>
          <div class="flight-popup-footer">
            <div class="freq-stack">
              <div class="freq-box${idle(1)}">
                <span class="freq-label">COM1</span>
                <span class="freq-value">${esc(frequency)}</span>
              </div>
              ${freq2}
            </div>
            ${coords}
          </div>
        </div>
      `;
    }

    // HELPERS
    // Escapa también COMILLAS, no solo <&>: el nombre del avión ahora va dentro de un
    // atributo (title="..."), y ahí una comilla suelta cerraría el atributo y dejaría
    // inyectar HTML. El nombre lo manda el cliente, así que no es dato de confianza.
    function esc(value) {
      return (value == null ? '' : String(value)).replace(/[<&>"']/g, function (character) {
        return { '<': '&lt;', '&': '&amp;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character];
      });
    }

    function fmtFreq(frequency) {
      return (frequency == null || Number(frequency) <= 0)
        ? '—'
        : Number(frequency).toFixed(3);
    }

    function fmtAlt(altitude) {
      return Math.round(altitude).toLocaleString('en-US');
    }

    // Formato aeronáutico: latitud con 2 dígitos de grado, longitud con 3 (0 delante).
    // El hemisferio va en su span para separarlo del número con un margen FIJO (no el
    // espacio mono, que quedaba demasiado ancho).
    function fmtLat(v) {
      var p = Math.abs(v).toFixed(4).split('.');
      // Grado a 2 dígitos (la latitud no pasa de 90°) PERO relleno hasta 3 caracteres
      // con un espacio fijo (no un "0" inventado): así el valor mide lo mismo que el
      // de longitud y el punto decimal cae en la misma columna del grid, sin falsear
      // el dato con un dígito que no existe.
      return '<span class="hemi">' + (v >= 0 ? 'N' : 'S') + '</span>' +
        '<span class="coord-val">' + p[0].padStart(3, '\u00A0') + '.' + p[1] + '°</span>';
    }
    function fmtLon(v) {
      var p = Math.abs(v).toFixed(4).split('.');
      return '<span class="hemi">' + (v >= 0 ? 'E' : 'W') + '</span>' +
        '<span class="coord-val">' + p[0].padStart(3, '0') + '.' + p[1] + '°</span>';
    }

    // MARKERS
    const markers = {};
    const REFRESH_MS = 5000;

    // ── ARO DE ALCANCE VHF (al pasar el ratón por un avión) ─────────────────
    // MISMA FÓRMULA QUE LA APP, no una aproximación: MumbleAudioEngine.cs calcula
    // el horizonte de radio como 1.23·(√alt_propia + √alt_peer) en NM con las
    // alturas en pies, y da voz limpia hasta el 75% de esa distancia. Si algún día
    // se toca allí, hay que tocarlo aquí o el mapa mentirá.
    //
    // El RADIO DEL ARO se dibuja contra una estación a nivel del suelo (10 ft),
    // porque el alcance real depende de las DOS altitudes y un avión no tiene un
    // radio único. Así el aro es el mínimo garantizado: todo lo que cae dentro le
    // oye seguro. El apagado en gris de los demás aviones sí es exacto, ese va
    // par a par con las dos alturas reales.
    const last = {};          // último dato recibido de cada indicativo
    let rings = [];           // aros pintados ahora mismo
    let ringsFor = null;      // de qué avión son, para moverlos en vez de recrearlos
    let hovered = null;       // indicativo cuyo aro se está pintando
    let hoverTimer = null;    // cuenta atrás desde que el ratón entra en un avión
    let pending = null;       // de QUIÉN es esa cuenta atrás
    let popupOpen = false;    // con un popup abierto no se pinta ningún aro

    const NM_TO_M = 1852;
    const GROUND_FT = 10;
    // El aro no sale al instante: hay que dejar el ratón quieto encima este rato. Así
    // el que solo va a pulsar para ver el popup no lo ve nunca, y cruzar el mapa por
    // encima de varios aviones no va encendiendo aros por el camino. Si se hace lento,
    // 600 ms es un buen punto: un clic se suele hacer en 300-400 ms.
    const RANGE_HOVER_MS = 1000;

    function rangeNm(aFt, bFt) {
      return 1.23 * (Math.sqrt(Math.max(aFt, 10)) + Math.sqrt(Math.max(bFt, 10)));
    }

    // Cuántos píxeles de pantalla ocupa una distancia en metros, aquí y ahora. Se mide
    // sobre el paralelo (este-oeste), que es donde la proyección Mercator no deforma.
    function radioEnPixeles(lat, lon, metros) {
      const dLon = metros / (111320 * Math.cos(lat * Math.PI / 180));
      const a = map.latLngToContainerPoint([lat, lon]);
      const b = map.latLngToContainerPoint([lat, lon + dLon]);
      return Math.abs(b.x - a.x);
    }

    function clearRings() {
      rings.forEach(function (r) { map.removeLayer(r); });
      rings = [];
      ringsFor = null;
    }

    // Repinta el aro según el estado actual. Las TRES condiciones para que se vea
    // (hay un avión señalado, no hay popup abierto y el aro cabe en pantalla) están
    // aquí y en ningún otro sitio, así que quien la llame no tiene que comprobar nada.
    function paintRange() {
      Object.keys(markers).forEach(function (cs) {
        const el = markers[cs].getElement();
        if (el) el.classList.remove('out', 'sel');
      });

      const callsign = hovered;
      const p = callsign ? last[callsign] : null;

      if (!p || p.alt == null || popupOpen) {
        clearRings();
        return;
      }

      const rFade  = rangeNm(p.alt, GROUND_FT);
      const rClear = rFade * 0.75;

      // Y tampoco se pinta si el aro NO CABE en la pantalla: acercando mucho solo se
      // vería un arco cruzando el mapa, que no dice nada. No vale un zoom máximo fijo
      // porque el tamaño depende de la altitud (un airliner a FL350 son 234 NM y una
      // avioneta a 1.500 ft son 50), así que se mide el radio real en píxeles y se
      // compara con la media diagonal del mapa.
      // El límite es un CUARTO de la diagonal. Cada nivel de zoom dobla el radio en
      // píxeles, así que pasar de la mitad al cuarto es exactamente quitarle un punto
      // de zoom: con la mitad se seguía viendo demasiado cerca.
      const size = map.getSize();
      const limite = Math.sqrt(size.x * size.x + size.y * size.y) / 4;
      if (radioEnPixeles(p.lat, p.lon, rClear * NM_TO_M) > limite) {
        clearRings();
        return;
      }

      if (rings.length === 2 && ringsFor === callsign) {
        // MOVER, NO RECREAR. El avión se actualiza cada 5 s y si aquí se borraran los
        // círculos para volver a crearlos, se repetiría la animación de entrada y el
        // aro daría un parpadeo en cada refresco. Cambiándoles centro y radio se
        // desplazan sin pestañear (y el radio se recalcula: si el avión sube, crece).
        rings.forEach(function (r) { r.setLatLng([p.lat, p.lon]); });
        rings[0].setRadius(rFade * NM_TO_M);
        rings[1].setRadius(rClear * NM_TO_M);
      } else {
        clearRings();
        rings.push(L.circle([p.lat, p.lon], {
          radius: rFade * NM_TO_M, className: 'range-ring',
          color: '#E8A33D', weight: 1, opacity: .28, dashArray: '4 7',
          fill: false, interactive: false
        }).addTo(map));

        rings.push(L.circle([p.lat, p.lon], {
          radius: rClear * NM_TO_M, className: 'range-ring',
          color: '#E8A33D', weight: 1, opacity: .45,
          fill: true, fillColor: '#E8A33D', fillOpacity: .03, interactive: false
        }).addTo(map));
        ringsFor = callsign;
      }

      // Quién queda fuera de su alcance. Par a par, con las dos altitudes.
      Object.keys(markers).forEach(function (cs) {
        const el = markers[cs].getElement();
        const q = last[cs];
        if (!el || !q) return;
        el.classList.remove('out', 'sel');
        if (cs === callsign) { el.classList.add('sel'); return; }
        const d = map.distance([p.lat, p.lon], [q.lat, q.lon]) / NM_TO_M;
        if (d >= rangeNm(p.alt, q.alt == null ? 10 : q.alt)) el.classList.add('out');
      });
    }

    function clearRange() {
      hovered = null;
      paintRange();
    }

    // Espera de intención: arranca la cuenta atrás al entrar en un avión. Si el ratón
    // se va antes, no llega a salir nada.
    function armRange(callsign) {
      cancelRange();
      // Al saltar de un avión a otro, el aro del anterior se apaga ya: el que se ve
      // tiene que ser siempre el del avión que estás señalando.
      if (hovered && hovered !== callsign) clearRange();
      pending = callsign;
      hoverTimer = setTimeout(function () {
        hoverTimer = null;
        pending = null;
        hovered = callsign;
        paintRange();
      }, RANGE_HOVER_MS);
    }

    function cancelRange() {
      if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; }
      pending = null;
    }

    map.on('popupopen',  function () { cancelRange(); popupOpen = true;  paintRange(); });
    map.on('popupclose', function () { popupOpen = false; paintRange(); });

    // El aro solo aparece señalando un avión con el ratón (se enciende siempre, en
    // cualquier zoom, mientras quepa en pantalla — ver paintRange).
    // Dónde está el puntero. Hace falta porque al hacer ZOOM los aviones se mueven
    // bajo el cursor: salta un `mouseout` y ya no entra ningún `mouseover` nuevo (el
    // ratón no se ha movido), así que sin esto el aro no volvía a salir hasta que
    // movías el ratón. Tras cada zoom se mira a mano qué hay debajo.
    let punteroXY = null;
    map.getContainer().addEventListener('mousemove', function (e) {
      punteroXY = [e.clientX, e.clientY];
    });
    map.getContainer().addEventListener('mouseleave', function () { punteroXY = null; });

    function avionBajoElPuntero() {
      if (!punteroXY) return null;
      const el = document.elementFromPoint(punteroXY[0], punteroXY[1]);
      const icono = el && el.closest ? el.closest('.plane-marker') : null;
      if (!icono) return null;
      return Object.keys(markers).find(function (cs) {
        return markers[cs].getElement() === icono;
      }) || null;
    }

    map.on('zoomend', function () {
      paintRange();

      // ¿Ha quedado un avión debajo del ratón? Se rearma la espera como si acabaras
      // de entrar en él: la regla del segundo sigue valiendo igual.
      const cs = avionBajoElPuntero();
      if (cs && hovered !== cs && pending !== cs) armRange(cs);
    });

    // Si cambia el tamaño de la ventana cambia si el aro cabe o no.
    map.on('resize', paintRange);

    function render(pilots, online) {
      const seen = {};

      pilots.forEach(function (pilot) {
        if (pilot.callsign == null || pilot.lat == null || pilot.lon == null) {
          return;
        }

        const callsign = pilot.callsign;
        const lat = Number(pilot.lat), lon = Number(pilot.lon);
        // Ignora posiciones basura con lat≈0 (Null Island / ecuador, frente a África):
        // MSFS reporta (0,0), (0,90) y variantes al cargar; TODAS tienen lat≈0 (por eso el
        // "en vuelo" de la app se basa en lat≠0). Una lectura mala teletransportaría el
        // avión al ecuador; se mantiene el marcador en su última posición buena.
        if (!isFinite(lat) || !isFinite(lon) || Math.abs(lat) < 0.02) {
          if (markers[callsign]) { seen[callsign] = true; }
          return;
        }
        seen[callsign] = true;

        const marker = markers[callsign];

        // Guardamos el último dato de cada uno: el aro necesita la altitud del
        // avión y la de los demás para saber a quién alcanza.
        last[callsign] = pilot;

        if (marker) {
          marker.setLatLng([lat, lon]);
          // OJO: aquí el mapa de producción llama a setIcon(), que RECONSTRUYE el
          // DOM del avión cada 5 s. Si el ratón está encima justo en ese momento,
          // el mouseout no llega nunca y el aro se queda pegado. Se gira el
          // elemento que ya existe y no se recrea nada.
          const el = marker.getElement();
          const plane = el && el.querySelector('.plane');
          if (plane) plane.style.transform = 'rotate(' + (Number(pilot.heading) || 0) + 'deg)';
          else marker.setIcon(planeIcon(callsign, pilot.heading));
          marker.setPopupContent(popupHtml(pilot));
        } else {
          const m =
            L.marker([lat, lon], {
              icon: planeIcon(callsign, pilot.heading)
            })
            .addTo(map)
            .bindPopup(popupHtml(pilot), { autoPan: false, keepInView: false });

          m.on('mouseover', function () { armRange(callsign); });
          // El mouseout SOLO borra si el aro sigue siendo suyo. Dos aviones juntos
          // se solapan (el divIcon mide 80x42, mucho más que el dibujo), así que al
          // pasar de uno a otro llega el mouseover del segundo ANTES que el mouseout
          // del primero — y sin esta guarda, el del primero borraba el aro recién
          // pintado del segundo y parecía que el hover no respondía.
          m.on('mouseout',  function () {
            // Cada avión solo cancela LO SUYO. Con las cajas solapadas, el mouseout de
            // uno llega después del mouseover del vecino: si cancelara sin mirar, se
            // cargaría la cuenta atrás recién armada del otro y su aro no saldría nunca.
            if (pending === callsign) cancelRange();
            if (hovered === callsign) clearRange();
          });

          markers[callsign] = m;
        }
      });

      Object.keys(markers).forEach(function (callsign) {
        if (!seen[callsign]) {
          map.removeLayer(markers[callsign]);
          delete markers[callsign];
          delete last[callsign];
          // Si el que se va es el que tenía el ratón encima, fuera su aro (y fuera la
          // cuenta atrás): si no, se quedaría flotando sobre un avión que ya no está.
          cancelRange();
          if (hovered === callsign) clearRange();
        }
      });

      // El avión se mueve cada 5 s: si sigue habiendo un aro puesto, se repinta en
      // su sitio nuevo (y con el radio recalculado, que la altitud habrá cambiado).
      if (hovered) paintRange();

      // 'seen' son exactamente los aviones que quedan en el mapa, así que el número
      // no puede desmentir a lo que se ve. Se actualiza aquí mismo, en el momento en
      // que llegan los datos: sin animación de conteo ni transición CSS, porque un
      // número que tarda en ponerse al día es un número que miente un rato.
      updateCount(Object.keys(seen).length, online);
    }

    // Dos números con significados distintos:
    //   onMap  = aviones pintados ahora mismo (los que ACTIVARON "Show me on the map").
    //   online = gente conectada de verdad, que la sabe Murmur, no el mapa.
    // Se enseñan los dos porque si no, el contador infravalora la red: quien no quiere
    // salir en el mapa es invisible aquí. Y de paso se ve que hay gente que elige no
    // aparecer y se le respeta.
    //
    // NUNCA se enseña un "0": si no hay nadie, el bloque entero (raya incluida)
    // desaparece y la barra queda como si esto no existiera. Decir "0 pilots" es
    // exacto y a la vez el peor cartel posible para quien llega por primera vez.
    function updateCount(onMap, online) {
      const box = document.getElementById('online');

      // Si no se pudo preguntar a Murmur (online null), se enseña solo lo que se ve:
      // mejor un número corto y cierto que dos con uno inventado. El Math.max es un
      // seguro: un 'online' rezagado NUNCA puede decir menos que los aviones pintados.
      const hasOnline = typeof online === 'number' && isFinite(online) && online >= 0;
      const total = hasOnline ? Math.max(online, onMap) : onMap;

      if (total < 1) { box.hidden = true; return; }

      // Si coinciden no hay nada que explicar → un solo número, sin etiquetas.
      // "on map" solo aparece cuando hace falta: cuando hay más gente que aviones.
      document.getElementById('online-text').innerHTML =
        total === onMap
          ? '<span class="n">' + total + '</span> ' + (total === 1 ? 'pilot' : 'pilots')
          : '<span class="n">' + total + '</span> online <span class="sep">·</span> ' +
            '<span class="n">' + onMap + '</span> on map';

      box.hidden = false;
    }

    // DATA
    async function load() {
      try {
        const response = await fetch('https://ourradiofs.duckdns.org/map/data', {
          cache: 'no-store'
        });

        if (!response.ok) { throw new Error('HTTP ' + response.status); }

        const data = await response.json();

        const pilots =
          Array.isArray(data) ? data
          : Array.isArray(data.pilots) ? data.pilots
          : [];

        // 'online' solo viene en la forma nueva (objeto). Con un agregador viejo que
        // aún devuelva la lista pelada llega undefined y el contador enseña solo los
        // aviones del mapa, como antes: la web nueva no depende de desplegar el VPS.
        render(pilots, (data && typeof data === 'object' && !Array.isArray(data))
                         ? data.online : undefined);
      } catch (error) {
        console.error('Error loading pilots:', error);
        render([]);
      }
    }

    load();
    setInterval(load, REFRESH_MS);
  </script>
</body>
</html>
