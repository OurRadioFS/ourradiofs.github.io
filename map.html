<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>OurRadioFS — live pilot map</title>

  <meta
    name="description"
    content="Live map of OurRadioFS pilots who chose to share their position. Tune their frequency and say hello."
  >

  <link rel="icon" href="assets/favicon.ico">

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    :root {
      --bg: #0D1117;
      --surface: #161B22;
      --border: #30363D;
      --text: #C9D1D9;
      --title: #E6EDF3;
      --muted: #6E7681;
      --amber: #E8A33D;

      --mono:
        'Consolas',
        'SF Mono',
        'Roboto Mono',
        ui-monospace,
        monospace;

      --sans:
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;

      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Header */

    header {
      display: flex;
      align-items: center;

      height: 56px;
      gap: 12px;
      padding: 0 18px;

      background: rgba(13, 17, 23, 0.9);
      border-bottom: 1px solid var(--border);

      z-index: 1200;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;

      font-size: 16px;
      font-weight: 700;
      color: var(--title);
    }

    .brand img {
      width: 26px;
      height: 26px;
    }

    header .links {
      margin-left: auto;

      display: flex;
      align-items: center;
      gap: 20px;

      font-size: 14px;
    }

    header .links a {
      color: var(--text);
    }

    header .links a:hover {
      color: var(--title);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 8px 15px;

      border: 1px solid var(--border);
      border-radius: 8px;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
    }

    .btn-primary {
      background: var(--amber);
      color: #1a1205 !important;
      border-color: var(--amber);
    }

    /* Map */

    #map {
      flex: 1;
      min-height: 0;
      background: #0a0d12;
    }

    .leaflet-container {
      background: #0a0d12;
    }

    /* Aircraft marker */

    .plane-marker {
      position: relative;

      width: 80px;
      height: 42px;

      pointer-events: auto;
    }

    .plane-marker .plane {
      position: absolute;

      left: 27px;
      top: 7px;

      width: 26px;
      height: 26px;

      color: var(--amber);

      filter:
        drop-shadow(
          0 0 5px rgba(232, 163, 61, 0.55)
        );

      transform-origin: center center;
    }

    .plane-marker .plane svg {
      display: block;

      width: 26px;
      height: 26px;
    }

    .plane-marker .tag {
      position: absolute;

      left: 40px;
      top: 31px;

      transform: translateX(-50%);

      padding: 1px 5px;

      color: var(--title);

      background: rgba(13, 17, 23, 0.9);
      border: 1px solid var(--border);
      border-radius: 5px;

      font-family: var(--mono);
      font-size: 10px;
      line-height: 14px;

      white-space: nowrap;
    }

    /* Leaflet */

    .leaflet-bar a {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }

    .leaflet-bar a:hover {
      background: #1b212b;
    }

    .leaflet-control-attribution {
      background: rgba(13, 17, 23, 0.7) !important;
      color: var(--muted) !important;
    }

    .leaflet-control-attribution a {
      color: var(--muted) !important;
    }

    /* Popup */

    .leaflet-popup-content-wrapper {
      padding: 0 !important;

      border-radius: 12px !important;
      overflow: hidden;

      background: transparent !important;
      border: 1px solid var(--border);

      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.8) !important;
    }

    .leaflet-popup-tip {
      background: var(--bg) !important;
    }

    .leaflet-popup-content {
      margin: 0 !important;

      width: max-content !important;
      min-width: 210px;
    }

    .flight-popup {
      background: var(--surface);
      color: var(--text);
      font-family: var(--sans);
    }

    .flight-popup-header {
      display: flex;
      align-items: center;

      padding: 12px 16px;

      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border);
    }

    .flight-popup-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .flight-popup-callsign {
      color: var(--title);

      font-family: var(--mono);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .flight-popup-aircraft {
      color: var(--muted);

      font-size: 13px;
      font-weight: 600;
    }

    .flight-popup-body {
      padding: 16px;
    }

    .flight-popup-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(80px, 1fr));

      gap: 16px 20px;
    }

    .flight-data-item {
      display: flex;
      flex-direction: column;
    }

    .flight-data-label {
      margin-bottom: 2px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .flight-data-value {
      color: var(--title);

      font-size: 14px;
      font-weight: 600;
    }

    .flight-popup-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      padding: 12px 16px;

      background: var(--bg);
      border-top: 1px solid var(--border);
    }

    .freq-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .freq-label {
      padding: 2px 6px;

      background: var(--border);
      border-radius: 4px;

      color: var(--text);

      font-size: 11px;
      font-weight: 700;
    }

    .freq-value {
      color: var(--amber);

      font-family: var(--mono);
      font-size: 15px;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <header>
    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="">
      OurRadioFS
    </a>

    <nav class="links">
      <a href="index.html">
        Home
      </a>

      <a
        class="btn btn-primary"
        href="https://flightsim.to/addon/111739/ourradiofs-the-community-vhf-radio"
        target="_blank"
        rel="noopener"
      >
        Download
      </a>
    </nav>
  </header>

  <div id="map"></div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // ─────────────────────────────────────────────
    // MAP
    // ─────────────────────────────────────────────

    const map = L.map('map', {
      worldCopyJump: true,
      zoomControl: true,
      attributionControl: true
    }).setView([46.5, 8.0], 5);

    L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
      {
        subdomains: 'abcd',
        maxZoom: 19,

        attribution:
          '&copy; ' +
          '<a href="https://www.openstreetmap.org/copyright" ' +
          'target="_blank" rel="noopener">' +
          'OpenStreetMap</a> contributors ' +

          '&copy; ' +
          '<a href="https://carto.com/attributions" ' +
          'target="_blank" rel="noopener">' +
          'CARTO</a>'
      }
    ).addTo(map);


    // ─────────────────────────────────────────────
    // AIRCRAFT ICON
    // ─────────────────────────────────────────────

    const PLANE =
      '<svg width="26" height="26" viewBox="0 0 24 24" ' +
      'fill="currentColor">' +

      '<path d="' +
      'M12 2c-.6 0-1 .9-1 2v5.2L3 14v2l8-2.3V19l-2 1.2V22l3-.9 3 .9v-1.8L13 19v-5.3l8 2.3v-2l-8-4.8V4c0-1.1-.4-2-1-2z' +
      '"/>' +

      '</svg>';


    function planeIcon(callsign, heading) {
      const rotation = Number(heading) || 0;

      return L.divIcon({
        className: 'plane-marker',

        iconSize: [80, 42],
        iconAnchor: [40, 21],

        html:
          '<div class="plane" style="transform:rotate(' +
          rotation +
          'deg)">' +

          PLANE +

          '</div>' +

          '<div class="tag">' +
          esc(callsign) +
          '</div>'
      });
    }


    // ─────────────────────────────────────────────
    // POPUP
    // ─────────────────────────────────────────────

    function popupHtml(pilot) {
      const aircraft =
        pilot.aircraft != null
          ? pilot.aircraft
          : '—';

      const altitude =
        pilot.alt != null
          ? fmtAlt(pilot.alt) + ' ft'
          : '—';

      const speed =
        pilot.speed != null
          ? Math.round(pilot.speed) + ' kts'
          : '—';

      const distance =
        pilot.dist != null
          ? Number(pilot.dist).toFixed(1) + ' km'
          : pilot.distance != null
            ? Number(pilot.distance).toFixed(1) + ' km'
            : '—';

      const heading =
        pilot.heading != null
          ? String(Math.round(pilot.heading)).padStart(3, '0') + '°'
        : '—';

      const frequency = fmtFreq(pilot.freq);

      return `
        <div class="flight-popup">

          <div class="flight-popup-header">
            <div class="flight-popup-title">

              <span class="flight-popup-callsign">
                ${esc(pilot.callsign)}
              </span>

              <span class="flight-popup-aircraft">
                ${esc(aircraft)}
              </span>

            </div>
          </div>

          <div class="flight-popup-body">
            <div class="flight-popup-grid">

              <div class="flight-data-item">
                <span class="flight-data-label">
                  Altitude
                </span>

                <span class="flight-data-value">
                  ${esc(altitude)}
                </span>
              </div>

              <div class="flight-data-item">
                <span class="flight-data-label">
                  Speed
                </span>

                <span class="flight-data-value">
                  ${esc(speed)}
                </span>
              </div>

              <div class="flight-data-item">
                <span class="flight-data-label">
                  Distance
                </span>

                <span class="flight-data-value">
                  ${esc(distance)}
                </span>
              </div>

              <div class="flight-data-item">
                <span class="flight-data-label">
                  Heading
                </span>

                <span class="flight-data-value">
                  ${esc(heading)}
                </span>
              </div>

            </div>
          </div>

          <div class="flight-popup-footer">
            <div class="freq-box">

              <span class="freq-label">
                COM1
              </span>

              <span class="freq-value">
                ${esc(frequency)}
              </span>

            </div>
          </div>

        </div>
      `;
    }


    // ─────────────────────────────────────────────
    // HELPERS
    // ─────────────────────────────────────────────

    function esc(value) {
      return (value == null ? '' : String(value))
        .replace(/[<&>]/g, function(character) {
          return {
            '<': '&lt;',
            '&': '&amp;',
            '>': '&gt;'
          }[character];
        });
    }


    function fmtFreq(frequency) {
      return (
        frequency == null ||
        Number(frequency) <= 0
      )
        ? '—'
        : Number(frequency).toFixed(3);
    }


    function fmtAlt(altitude) {
      return Math.round(altitude)
        .toLocaleString('en-US');
    }


    // ─────────────────────────────────────────────
    // MARKERS
    // ─────────────────────────────────────────────

    const markers = {};

    const REFRESH_MS = 5000;


    function glide(marker, target) {
      const from = marker.getLatLng();

      if (
        Math.abs(from.lat - target[0]) < 0.000001 &&
        Math.abs(from.lng - target[1]) < 0.000001
      ) {
        return;
      }

      if (marker._raf) {
        cancelAnimationFrame(marker._raf);
      }

      const start = performance.now();
      const duration = REFRESH_MS * 1.25;


      function step(now) {
        const t = Math.min(
          1,
          (now - start) / duration
        );

        marker.setLatLng([
          from.lat +
          (target[0] - from.lat) * t,

          from.lng +
          (target[1] - from.lng) * t
        ]);

        if (t < 1) {
          marker._raf =
            requestAnimationFrame(step);
        }
      }


      marker._raf =
        requestAnimationFrame(step);
    }


    function render(pilots) {
      const seen = {};

      pilots.forEach(function(pilot) {
        if (
          pilot.callsign == null ||
          pilot.lat == null ||
          pilot.lon == null
        ) {
          return;
        }

        const callsign = pilot.callsign;

        seen[callsign] = true;

        const marker = markers[callsign];


        if (marker) {
          glide(
            marker,
            [
              Number(pilot.lat),
              Number(pilot.lon)
            ]
          );

          marker.setIcon(
            planeIcon(
              callsign,
              pilot.heading
            )
          );

          marker.setPopupContent(
            popupHtml(pilot)
          );
        }


        else {
          const newMarker = L.marker(
            [
              Number(pilot.lat),
              Number(pilot.lon)
            ],
            {
              icon: planeIcon(
                callsign,
                pilot.heading
              )
            }
          )
            .addTo(map)
            .bindPopup(
              popupHtml(pilot)
            );

          markers[callsign] = newMarker;
        }
      });


      Object.keys(markers).forEach(function(callsign) {
        if (!seen[callsign]) {
          map.removeLayer(
            markers[callsign]
          );

          delete markers[callsign];
        }
      });
    }


    // ─────────────────────────────────────────────
    // DATA
    // ─────────────────────────────────────────────

    async function load() {
      try {
        const response =
          await fetch(
            'https://ourradiofs.duckdns.org/map/data',
            {
              cache: 'no-store'
            }
          );

        if (!response.ok) {
          throw new Error(
            'HTTP ' + response.status
          );
        }

        const data =
          await response.json();

        const pilots =
          Array.isArray(data)
            ? data
            : Array.isArray(data.pilots)
              ? data.pilots
              : [];

        render(pilots);
      }

      catch (error) {
        console.error(
          'Error loading pilots:',
          error
        );

        render([]);
      }
    }


    // Initial load
    load();


    // Refresh every 5 seconds
    setInterval(
      load,
      REFRESH_MS
    );
  </script>

</body>
</html>
